# Deploy TaskStick to IONOS (tasks.tesh.ai) over SFTP.
#
# • Every push to main uploads only the files changed since the last
#   successful deploy (tracked by the `deployed` git tag, which this workflow
#   moves forward after each success) — so a failed run never leaves the
#   server behind; the next one catches up.
# • A commit message line "Deploy-Since: <sha>" deploys everything changed
#   since that commit instead (catch-ups/redeploys without the Actions UI).
# • "Run workflow" (Actions tab) can redeploy everything changed since a
#   commit, or every deployable file.
# • Then it smoke-tests the live site.
#
# Uses the repo's own deploy.py. Credentials come from repository secrets
# (Settings → Secrets and variables → Actions), either four separate secrets
#   IONOS_SFTP_HOST, IONOS_SFTP_USER, IONOS_SFTP_PASSWORD, IONOS_REMOTE_ROOT
# or one secret IONOS_DEPLOY holding those four as "NAME: value" lines.
# Never deploys data/, secrets, docs, the plugin source or the Mac helper.

name: Deploy to IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      since:
        description: "Deploy files changed since this commit (SHA). Leave empty for just the latest commit."
        required: false
        default: ""
      all:
        description: "Deploy every deployable file instead"
        type: boolean
        default: false

permissions:
  contents: write   # to move the `deployed` tag after a successful deploy

concurrency:
  group: ionos-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Work out which files to upload or delete
        id: files
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SINCE: ${{ inputs.since }}
          ALL: ${{ inputs.all }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          TRAILER=$(printf '%s\n' "$HEAD_MSG" | sed -n 's/^Deploy-Since:[[:space:]]*\([0-9a-fA-F]\{7,40\}\)[[:space:]]*$/\1/p' | tail -1)
          BASE=""
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$ALL" = "true" ]; then
            BASE="ALL"
          elif [ "$EVENT" = "push" ] && [ -n "$TRAILER" ]; then
            echo "Deploy-Since trailer: $TRAILER"; BASE="$TRAILER"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ -n "$SINCE" ]; then
            BASE="$SINCE"
          elif git rev-parse -q --verify refs/tags/deployed >/dev/null; then
            echo "Last successful deploy: $(git rev-parse --short deployed)"; BASE="deployed"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            BASE="$BEFORE"
          else
            BASE="HEAD~1"
          fi
          if [ "$BASE" = "ALL" ]; then
            git ls-files > /tmp/changed; : > /tmp/deleted
          else
            # --no-renames: a moved file is an upload at the new path plus a delete at the old one
            git diff --no-renames --name-only --diff-filter=AM "$BASE" HEAD > /tmp/changed
            git diff --no-renames --name-only --diff-filter=D  "$BASE" HEAD > /tmp/deleted
          fi
          # Keep only files the website needs (and never touch data/ or secrets).
          FILTER='^(\.github/|\.claude-plugin/|plugin/|archive/|mac-helper/|data/|downloads/)|\.md$|^deploy.*\.py$|\.example$|^\.gitignore$|^config\.local\.php$'
          grep -vE "$FILTER" /tmp/changed > /tmp/deploy || true
          grep -vE "$FILTER" /tmp/deleted > /tmp/remove || true
          echo "Files to upload:"; cat /tmp/deploy || true
          echo "Files to delete on the server:"; cat /tmp/remove || true
          echo "count=$(( $(grep -c . /tmp/deploy || true) + $(grep -c . /tmp/remove || true) ))" >> "$GITHUB_OUTPUT"
          cat /tmp/deploy /tmp/remove | grep -qE '^(mcp/|mcp-server/|oauth/|\.htaccess$|\.well-known/|auth/)' && echo "mcp=true" >> "$GITHUB_OUTPUT" || echo "mcp=false" >> "$GITHUB_OUTPUT"

      - name: PHP syntax check
        if: steps.files.outputs.count != '0'
        run: |
          set -e
          for f in $(grep '\.php$' /tmp/deploy || true); do php -l "$f"; done

      - name: Upload over SFTP
        if: steps.files.outputs.count != '0'
        env:
          SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          SFTP_PASS: ${{ secrets.IONOS_SFTP_PASSWORD }}
          REMOTE_ROOT: ${{ secrets.IONOS_REMOTE_ROOT }}
          IONOS_DEPLOY: ${{ secrets.IONOS_DEPLOY }}
        run: |
          set -euo pipefail
          pip install --quiet paramiko
          # deploy.py reads its settings from deploy_local.py; build it from the
          # four separate secrets, or from the combined IONOS_DEPLOY secret.
          python3 - <<'PY'
          import os, sys
          cfg = {}
          for line in os.environ.get("IONOS_DEPLOY", "").splitlines():
              name, sep, value = line.partition(":")
              if sep and name.strip():
                  cfg[name.strip().upper()] = value.strip()
          def get(env, key, default=""):
              return os.environ.get(env) or cfg.get(key) or default
          host = get("SFTP_HOST", "IONOS_SFTP_HOST")
          user = get("SFTP_USER", "IONOS_SFTP_USER")
          pw   = get("SFTP_PASS", "IONOS_SFTP_PASSWORD")
          root = get("REMOTE_ROOT", "IONOS_REMOTE_ROOT", "/tasks-app")
          if not (host and user and pw):
              print("::error::No SFTP credentials found. Add the IONOS_DEPLOY secret (or the four IONOS_SFTP_* secrets) under Settings → Secrets and variables → Actions → Repository secrets.")
              sys.exit(1)
          print(f"::add-mask::{pw}")
          print(f"Deploying as {user}@{host} into {root}")
          with open("deploy_local.py", "w") as f:
              f.write(f"SFTP_HOST = {host!r}\nSFTP_USER = {user!r}\nSFTP_PASS = {pw!r}\nSFTP_PORT = 22\nREMOTE_ROOT = {root!r}\n")
          PY
          if [ -s /tmp/deploy ]; then python3 deploy.py $(cat /tmp/deploy); fi
          if [ -s /tmp/remove ]; then python3 - <<'PY'
          import posixpath, paramiko, deploy_local as c
          t = paramiko.Transport((c.SFTP_HOST, c.SFTP_PORT)); t.connect(username=c.SFTP_USER, password=c.SFTP_PASS)
          s = paramiko.SFTPClient.from_transport(t)
          root = c.REMOTE_ROOT.rstrip('/')
          dirs = set()
          for rel in open('/tmp/remove').read().split():
              path = f"{root}/{rel}"
              try:
                  s.remove(path); print(f"deleted {rel}")
              except FileNotFoundError:
                  print(f"already gone: {rel}")
              d = posixpath.dirname(rel)
              while d:
                  dirs.add(d); d = posixpath.dirname(d)
          # Remove folders that are now empty, deepest first; report any that aren't.
          for d in sorted(dirs, key=lambda x: -x.count('/')):
              try:
                  s.rmdir(f"{root}/{d}"); print(f"removed folder {d}/")
              except IOError:
                  try:
                      left = s.listdir(f"{root}/{d}")
                      if left: print(f"::warning::{d}/ still has files on the server: {', '.join(sorted(left)[:20])}")
                  except IOError:
                      pass
          s.close(); t.close()
          PY
          fi
          # One-time cleanup (BUG-023): the MCP server moved from mcp/ to
          # mcp-server/. A real mcp/ directory on the server breaks the /mcp
          # rewrites, so remove it once the repo no longer has one. Files git
          # never tracked are moved into data/legacy-mcp/ (protected), not deleted.
          if [ ! -d mcp ]; then python3 - <<'PY'
          import stat, paramiko, deploy_local as c
          t = paramiko.Transport((c.SFTP_HOST, c.SFTP_PORT)); t.connect(username=c.SFTP_USER, password=c.SFTP_PASS)
          s = paramiko.SFTPClient.from_transport(t)
          root = c.REMOTE_ROOT.rstrip('/')
          def exists(p):
              try: s.stat(p); return True
              except IOError: return False
          if exists(f"{root}/mcp"):
              keep = {"tokens.json"}                      # untracked v1 file: preserve it
              if not exists(f"{root}/data/legacy-mcp"): s.mkdir(f"{root}/data/legacy-mcp")
              def wipe(d, rel=""):
                  for e in s.listdir_attr(d):
                      p = f"{d}/{e.filename}"; r = f"{rel}{e.filename}"
                      if stat.S_ISDIR(e.st_mode):
                          wipe(p, r + "/"); s.rmdir(p); print(f"removed folder mcp/{r}/")
                      elif r in keep:
                          s.rename(p, f"{root}/data/legacy-mcp/{e.filename}"); print(f"moved mcp/{r} -> data/legacy-mcp/")
                      else:
                          s.remove(p); print(f"deleted mcp/{r}")
              wipe(f"{root}/mcp")
              s.rmdir(f"{root}/mcp"); print("removed old mcp/ folder")
          else:
              print("no old mcp/ folder on the server")
          s.close(); t.close()
          PY
          fi
          rm -f deploy_local.py

      - name: Smoke test the live site
        if: steps.files.outputs.count != '0'
        env:
          CHECK_MCP: ${{ steps.files.outputs.mcp }}
        run: |
          set -uo pipefail
          B=https://tasks.tesh.ai
          fail=0
          check() { if eval "$2"; then echo "✓ $1"; else echo "::error::✗ $1"; fail=1; fi; }
          sleep 3
          check "homepage 200" '[ "$(curl -s -o /dev/null -w %{http_code} $B/)" = 200 ]'
          check "unknown path loads the app" '[ "$(curl -s -o /dev/null -w %{http_code} $B/no-such-page-$RANDOM)" = 200 ]'
          check "API returns JSON" 'curl -s $B/api/version.php | python3 -c "import sys,json; json.load(sys.stdin)"'
          if [ "$CHECK_MCP" = "true" ]; then
            body='{"jsonrpc":"2.0","id":1,"method":"initialize"}'
            check "OAuth server metadata" 'curl -s $B/.well-known/oauth-authorization-server | grep -q client_id_metadata_document_supported'
            check "protected-resource metadata" 'curl -s "$B/.well-known/oauth-protected-resource/mcp/" | grep -q "tasks.tesh.ai/mcp/"'
            
            check "POST /mcp/ asks for sign-in" 'curl -s -D - -o /dev/null -X POST -H "Content-Type: application/json" -d "$body" $B/mcp/ | grep -qi "www-authenticate: Bearer resource_metadata"'
            check "setup page 200" '[ "$(curl -s -o /dev/null -w %{http_code} $B/mcp/setup.php)" = 200 ]'
            check "mcp-server/lib not public" '[ "$(curl -s -o /dev/null -w %{http_code} $B/mcp-server/lib/oauth.php)" = 403 ]'
            check "plugin zip downloads" 'curl -s $B/mcp-server/taskstick-plugin.zip | head -c 2 | grep -q PK'
          fi
          exit $fail

      - name: Mark this commit as deployed
        if: success()
        run: |
          git tag -f deployed HEAD
          git push -f origin refs/tags/deployed
