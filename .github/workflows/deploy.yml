# Deploy TaskStick to IONOS (tasks.tesh.ai) over SFTP.
#
# • Every push to main uploads only the files changed since the last
#   successful deploy (tracked by the `deployed` git tag, which this workflow
#   moves forward after each success) — so a failed run never leaves the
#   server behind; the next one catches up.
# • "Run workflow" (Actions tab) can redeploy everything changed since a
#   commit, or every deployable file.
# • Then it smoke-tests the live site.
#
# Uses the repo's own deploy.py. Credentials come from repository secrets
# (Settings → Secrets and variables → Actions):
#   IONOS_SFTP_HOST, IONOS_SFTP_USER, IONOS_SFTP_PASSWORD, IONOS_REMOTE_ROOT
# Never deploys data/, secrets, docs, the plugin source or the Mac helper.

name: Deploy to IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      since:
        description: "Deploy files changed since this commit (SHA). Leave empty for just the latest commit."
        required: false
        default: ""
      all:
        description: "Deploy every deployable file instead"
        type: boolean
        default: false

permissions:
  contents: write   # to move the `deployed` tag after a successful deploy

concurrency:
  group: ionos-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which files to upload
        id: files
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SINCE: ${{ inputs.since }}
          ALL: ${{ inputs.all }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$ALL" = "true" ]; then
            git ls-files > /tmp/changed
          elif [ "$EVENT" = "workflow_dispatch" ] && [ -n "$SINCE" ]; then
            git diff --name-only --diff-filter=AMR "$SINCE" HEAD > /tmp/changed
          elif git rev-parse -q --verify refs/tags/deployed >/dev/null; then
            echo "Last successful deploy: $(git rev-parse --short deployed)"
            git diff --name-only --diff-filter=AMR deployed HEAD > /tmp/changed
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            git diff --name-only --diff-filter=AMR "$BEFORE" HEAD > /tmp/changed
          else
            git diff-tree --no-commit-id --name-only -r --diff-filter=AMR HEAD > /tmp/changed
          fi
          # Keep only files the website needs.
          grep -vE '^(\.github/|\.claude-plugin/|plugin/|archive/|mac-helper/|data/|downloads/)|\.md$|^deploy.*\.py$|\.example$|^\.gitignore$' /tmp/changed > /tmp/deploy || true
          echo "Files to deploy:"; cat /tmp/deploy || true
          echo "count=$(grep -c . /tmp/deploy || true)" >> "$GITHUB_OUTPUT"
          grep -qE '^(mcp/|oauth/|\.htaccess$|auth/)' /tmp/deploy && echo "mcp=true" >> "$GITHUB_OUTPUT" || echo "mcp=false" >> "$GITHUB_OUTPUT"

      - name: PHP syntax check
        if: steps.files.outputs.count != '0'
        run: |
          set -e
          for f in $(grep '\.php$' /tmp/deploy || true); do php -l "$f"; done

      - name: Upload over SFTP
        if: steps.files.outputs.count != '0'
        env:
          SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          SFTP_PASS: ${{ secrets.IONOS_SFTP_PASSWORD }}
          REMOTE_ROOT: ${{ secrets.IONOS_REMOTE_ROOT }}
        run: |
          set -euo pipefail
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$SFTP_PASS" ]; then
            echo "::error::Add the IONOS_SFTP_* repository secrets first (Settings → Secrets and variables → Actions)."; exit 1
          fi
          pip install --quiet paramiko
          # deploy.py reads its settings from deploy_local.py; build it from the secrets.
          python3 - <<'PY'
          import os
          with open("deploy_local.py", "w") as f:
              f.write(f"SFTP_HOST = {os.environ['SFTP_HOST']!r}\n")
              f.write(f"SFTP_USER = {os.environ['SFTP_USER']!r}\n")
              f.write(f"SFTP_PASS = {os.environ['SFTP_PASS']!r}\n")
              f.write("SFTP_PORT = 22\n")
              f.write(f"REMOTE_ROOT = {os.environ.get('REMOTE_ROOT') or '/tasks-app'!r}\n")
          PY
          python3 deploy.py $(cat /tmp/deploy)
          rm -f deploy_local.py

      - name: Smoke test the live site
        if: steps.files.outputs.count != '0'
        env:
          CHECK_MCP: ${{ steps.files.outputs.mcp }}
        run: |
          set -uo pipefail
          B=https://tasks.tesh.ai
          fail=0
          check() { if eval "$2"; then echo "✓ $1"; else echo "::error::✗ $1"; fail=1; fi; }
          sleep 3
          check "homepage 200" '[ "$(curl -s -o /dev/null -w %{http_code} $B/)" = 200 ]'
          check "API returns JSON" 'curl -s $B/api/auth/status | python3 -c "import sys,json; json.load(sys.stdin)"'
          if [ "$CHECK_MCP" = "true" ]; then
            body='{"jsonrpc":"2.0","id":1,"method":"initialize"}'
            check "OAuth server metadata" 'curl -s $B/.well-known/oauth-authorization-server | grep -q client_id_metadata_document_supported'
            check "protected-resource metadata" 'curl -s $B/.well-known/oauth-protected-resource/mcp | grep -q "tasks.tesh.ai/mcp"'
            check "POST /mcp asks for sign-in" 'curl -s -D - -o /dev/null -X POST -H "Content-Type: application/json" -d "$body" $B/mcp | grep -qi "www-authenticate: Bearer resource_metadata"'
            check "POST /mcp/ asks for sign-in" 'curl -s -D - -o /dev/null -X POST -H "Content-Type: application/json" -d "$body" $B/mcp/ | grep -qi "www-authenticate: Bearer resource_metadata"'
            check "setup page 200" '[ "$(curl -s -o /dev/null -w %{http_code} $B/mcp/setup.php)" = 200 ]'
            check "mcp/lib not public" '[ "$(curl -s -o /dev/null -w %{http_code} $B/mcp/lib/oauth.php)" = 403 ]'
          fi
          exit $fail

      - name: Mark this commit as deployed
        if: success()
        run: |
          git tag -f deployed HEAD
          git push -f origin refs/tags/deployed
